# ════════════════════════════════════════════════════════════════
#  Router 设置
# ════════════════════════════════════════════════════════════════
router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  cooldown_time: 60
  enable_pre_call_checks: true
  retry_after: 5
  allowed_fails: 3
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  # 任务输入超过 free-pool 渠道的 max_input_tokens 时，自动改路由到 strong-model-pool
  # 注意：trusted-pool 故意不在这条链路里，见上面的说明。
  context_window_fallbacks:
    - free-pool: ["strong-model-pool"]
    - fast-pool: ["free-pool", "strong-model-pool"]

  fallbacks:
    - fast-pool: ["free-pool", "strong-model-pool"]
    - free-pool: ["strong-model-pool"]
    # fallback 图保持有向无环；强档失效时不再回退到 free-pool，
    # 避免 free -> strong -> free 的版本依赖循环和质量语义倒退。
    # trusted-pool 故意不设置 fallback：宁可报错，不可把敏感内容泄漏给
    # 未经验证的第三方渠道（Agnes AI / 中转站）。

  callbacks:
    - gateway.custom_router_hook.proxy_handler_instance

  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  # 对工具调用/JSON Schema 等语义宁可明确失败，不能静默丢参数后
  # 返回一个“看似成功、实际协议已被破坏”的普通文本响应。
  drop_params: false
  request_timeout: 120
  num_retries: 3

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_telemetry: true
  # 免费渠道的 RPD 很低，对 105 个（含 direct/trusted 派生副本）deployment
  # 做 completion 式后台健康检查会本末倒置地耗尽免费额度。默认改用：
  # provider-monitor 的 /models 目录审计 + Router 被动熔断 + 手动 scripts/health_check.py。
  background_health_checks: false
  health_check_details: false
  store_prompts_in_spend_logs: false
