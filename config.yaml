# ════════════════════════════════════════════════════════════════
#  AI Gateway Matrix — LiteLLM 配置 (v5 — 安全加固版)
#
#  整合 40+ 免费/试用 LLM API 渠道，按任务复杂度自动路由，最大化免费额度利用率。
#
#  模型分组（按参数量大致能力，非绝对）：
#    · 弱  fast-pool          0.5B–8B   分类/提取/摘要/简单问答
#    · 中  free-pool          9B–30B    日常写作/翻译/普通编程
#    · 强  strong-model-pool  31B–100B  复杂写作/代码分析/多条件（70B 属强）
#    · 顶级 elite-model-pool  100B+     复杂推理/长文本/项目规划（不保证必胜优秀小模型）
#    · auto-route / mode-intelligent  智能：强模型先判强度，再选档
#    · mode-weak / mid / strong / elite  固定档入口
#    · trusted-pool                   敏感内容强制官方渠道
#
# ════════════════════════════════════════════════════════════════
#  渠道优先级说明（priority 字段，数字越大优先级越高）：
#    priority: 100  最优先使用（完全免费 + 高额度 + 快速）
#    priority: 80   次优先（免费 + 中等额度）
#    priority: 60   备选（免费但额度有限）
#    priority: 40   兜底（试用额度，用完即止）
#    priority: 20   最后兜底（中转站，稳定性不确定）
#
#  RPM / max_budget：simple-shuffle 下仍可作为权重提示；仪表盘配额账本
#  与 Router 内部限流是两套体系（见 README）。
#
#  路由策略（社区共识，2025–2026）：
#  · 官方文档：生产环境推荐 simple-shuffle（默认，延迟最低）。
#  · GitHub #16060：usage-based-routing-v2 在仍有可用 deployment 时会
#    误报 RateLimitError「No deployments available for selected model」
#    （Deployments 字典里甚至还能看到 current_rpm / rpm_limit）。
#    多位用户回退到 simple-shuffle 后恢复。issue 截至修复前仍 open。
#  · 因此本配置使用 simple-shuffle + enable_weighted_failover：
#    同 model_name 池内失败会换 peer deployment，而不是立刻把整池判死。
# ════════════════════════════════════════════════════════════════

model_list:
  # ════════════════════════════════════════════════════════════════
  #  统一入口 / 模式别名（占位 deployment；hook 会改写真实目标）
  # ════════════════════════════════════════════════════════════════
  - model_name: auto-route
    litellm_params: &auto_route_placeholder
      model: openai/glm-4.7-flash
      api_base: https://open.bigmodel.cn/api/paas/v4/
      api_key: os.environ/GLM_API_KEY
      rpm: 200
      max_budget: 0.01
      budget_duration: 1day

  - model_name: mode-intelligent
    litellm_params:
      <<: *auto_route_placeholder

  - model_name: mode-weak
    litellm_params:
      <<: *auto_route_placeholder

  - model_name: mode-mid
    litellm_params:
      <<: *auto_route_placeholder

  - model_name: mode-strong
    litellm_params:
      <<: *auto_route_placeholder

  - model_name: mode-elite
    litellm_params:
      <<: *auto_route_placeholder

  # ════════════════════════════════════════════════════════════════
  #  fast-pool — 弱档（约 0.5B–8B）：分类 / 提取 / 摘要 / 简单问答
