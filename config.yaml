  # ════════════════════════════════════════════════════════════════
  #  v4 新增渠道
  # ════════════════════════════════════════════════════════════════

  # ─── Agnes AI（观察期渠道，请知情后使用，勿用于敏感任务）──────
  # 平台: https://platform.agnes-ai.com/  API Base: https://apihub.agnes-ai.com/v1
  # 背景公司 Sapiens AI，2026年6月上线，"永久免费/无Token上限"是自我宣传。
  # 调研中发现的风险信号：
  #   · 上线不到一个月，缺乏独立第三方审计/口碑积累
  #   · "Claw-Eval" 排行榜是其自建/关联的评测站（非 LMSYS Arena 这类独立评测），
  #     却用它证明自己"进入全球 AI 实验室前十"
  #   · 社交媒体上的推广话术高度模板化，符合"先圈用户免费流量再说"的典型模式
  #
  # 你的决定（已知情，尊重）：这个渠道每分钟 20 次请求、且官方宣称不设总量
  # 上限，额度确实很香，愿意承担"它可能随时跑路/条款突变"的风险来换取这份
  # 额度——所以这里没有像我最初建议的那样把优先级压到最低，而是给了一个
  # "认真用起来，但依然低于所有官方直营渠道"的优先级（60）。
  # 安全底线没有松动：
  #   · 依然没有加入 trusted-pool —— gateway/custom_router_hook.py 检测到 prompt 
  #     里疑似含 API Key/密码/内网地址等敏感信息时，永远不会分给它
  #   · 依然没有加入 strong-model-pool —— 复杂任务（重构/架构/安全审计等）
  #     命中关键词会优先升级到有官方背书的大模型渠道，不会因为普通的
  #     "复杂度高"就把内容送到这个观察期渠道
  #   · 如果你后续想让它也承担 strong-model-pool 的复杂任务，可以照着
  #     下面 strong-model-pool 里其他条目的格式手动加一份，但请再想一遍：
  #     值不值得让"可能随时下线的新渠道"去处理你最复杂/最可能带敏感信息
  #     的那部分请求。
  - model_name: free-pool
    litellm_params:
      model: openai/Agnes-2.0-Flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      rpm: 20
      max_budget: 0.01
      budget_duration: 1day
      priority: 60
      max_input_tokens: 1000000

