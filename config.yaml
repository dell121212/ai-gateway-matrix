# ════════════════════════════════════════════════════════════════
#  AI Gateway Matrix — LiteLLM 配置 (v5 — 安全加固版)
#
#  整合 40+ 免费/试用 LLM API 渠道，按任务复杂度自动路由，最大化免费额度利用率。
#
#  五个模型分组（model_name）：
#    · auto-route         统一入口，由 gateway/custom_router_hook.py 按复杂度改写
#    · free-pool          所有免费渠道，按 RPM + 预算自动负载均衡
#    · fast-pool          超快推理渠道（Groq/Cerebras/SambaNova），用于简单任务
#    · strong-model-pool  大模型渠道（Llama 405B/Gemini 2.5 Pro），用于复杂任务
#    · trusted-pool       只含 provider_manifest.yaml 显式设置
#                          sensitive_allowed=true 的渠道，不再由“官方直营”自动推导。
#                          gateway/custom_router_hook.py 检测到 prompt 里疑似包含
#                          API Key / 密码 / 内网地址 / 数据库连接串等敏感信息时，
#                          强制走这个池子，即使命中了"升级到 strong-model-pool"
#                          的复杂度规则也会被这条规则覆盖——隐私优先于路由性能。
#
#  客户端调用 model="auto-route"；
#  gateway/custom_router_hook.py 会在请求真正发出前，根据任务内容把它改写成
#  "fast-pool" / "free-pool" / "strong-model-pool" / "trusted-pool"。
#
# ════════════════════════════════════════════════════════════════
#  渠道优先级说明（priority 字段，数字越大优先级越高）：
#    priority: 100  最优先使用（完全免费 + 高额度 + 快速）
#    priority: 80   次优先（免费 + 中等额度）
#    priority: 60   备选（免费但额度有限）
#    priority: 40   兜底（试用额度，用完即止）
#    priority: 20   最后兜底（中转站，稳定性不确定）
#
#  RPM（每分钟请求数）和 max_budget（每日预算美元）用于 usage-based-routing-v2
#  的负载均衡：Router 会优先把请求分给 RPM 余量最多、预算最充足的渠道。
#
#  ⚠️ 已知问题（v5 记录）：LiteLLM GitHub 上有一个 2025-10-29 提交、
#  截至目前仍未关闭的 issue（usage-based-routing-v2 在有可用 deployment 时
#  仍误报 "no deployments available"）。上生产前请先在真实并发下跑一遍
#  scripts/test_gateway.py，确认这 44+ 个 deployment 不会触发同样的问题；
#  如果频繁触发，考虑把 routing_strategy 换成 simple-shuffle。
# ════════════════════════════════════════════════════════════════

model_list:
  # ════════════════════════════════════════════════════════════════
  #  auto-route — 统一入口（安全默认值，hook 改写后不会真正使用）
  # ════════════════════════════════════════════════════════════════
  - model_name: auto-route
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://open.bigmodel.cn/api/paas/v4/
      api_key: os.environ/GLM_API_KEY
      rpm: 200
      max_budget: 0.01
      budget_duration: 1day

  # ════════════════════════════════════════════════════════════════
