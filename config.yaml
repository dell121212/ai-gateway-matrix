# ════════════════════════════════════════════════════════════════
#  Router 设置
# ════════════════════════════════════════════════════════════════
router_settings:
  # 生产推荐：simple-shuffle（见官方 routing 文档；避开 #16060 v2 误判）
  routing_strategy: simple-shuffle
  # 同池多 deployment：某一个 401/404/429 先换 peer，不要整池报死
  enable_weighted_failover: true
  # 单个 deployment 最多重试一次；失败后尽快换 peer，再走跨池 fallbacks。
  num_retries: 1
  max_fallbacks: 8
  # 冷却要短：智谱 GLM 等免费层「访问量过大」是常态、过一会又能用。
  # 一次 429 只短暂让出（秒级），下次请求仍应再试，绝不能「失败一次就长期不用」。
  # 真·坏 Key（401）用 allowed_fails_policy 立刻冷却；拥挤（429）高容忍。
  cooldown_time: 5
  allowed_fails: 3
  enable_pre_call_checks: true
  retry_after: 1
  retry_policy:
    # 鉴权失败：别空转；限流/拥挤：多试几次 + 短冷却后再进池
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 1
    # 明确额度耗尽在 hook 中长熔断；通用 429 也只重试一次，尽快换 peer。
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 2
    ContentPolicyViolationErrorRetries: 1
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    # 部分厂商把「繁忙」包成 400/BadRequest，勿 0 次就永久感冷冻
    BadRequestErrorAllowedFails: 3
    # 免费层 429 极常见：提高阈值，配合 cooldown_time=5 实现「稍后还试」
    RateLimitErrorAllowedFails: 20
    TimeoutErrorAllowedFails: 3
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  # 任务输入超过 free-pool 渠道的 max_input_tokens 时，自动改路由到 strong-model-pool
  # 注意：trusted-pool 故意不在这条链路里，见上面的说明。
  # 有向无环（弱→中→强→顶级）。顶级池在 litellm fallbacks 不再下跳，
  # 避免 elite→free→…→elite 成环；顶级不可用时由 custom_router_hook 跨池选。
  context_window_fallbacks:
    - free-pool: ["strong-model-pool", "elite-model-pool"]
    - fast-pool: ["free-pool", "strong-model-pool", "elite-model-pool"]
    - strong-model-pool: ["elite-model-pool"]

  fallbacks:
    - fast-pool: ["free-pool", "strong-model-pool", "elite-model-pool"]
    - free-pool: ["strong-model-pool", "elite-model-pool"]
    - strong-model-pool: ["elite-model-pool"]
    - auto-route: ["fast-pool", "free-pool", "strong-model-pool", "elite-model-pool"]
    - mode-intelligent: ["fast-pool", "free-pool", "strong-model-pool", "elite-model-pool"]
    - mode-weak: ["free-pool", "strong-model-pool", "elite-model-pool"]
    - mode-mid: ["strong-model-pool", "elite-model-pool"]
    - mode-strong: ["elite-model-pool"]
    # mode-elite / elite-model-pool：不在此写回跳边；hook 负责可用性跨池

  callbacks:
    - gateway.custom_router_hook.proxy_handler_instance

  set_verbose: false
  json_logs: true
  turn_off_message_logging: true
  # 对工具调用/JSON Schema 等语义宁可明确失败，不能静默丢参数后
  # 返回一个“看似成功、实际协议已被破坏”的普通文本响应。
  drop_params: false
  request_timeout: 120
  num_retries: 1

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_telemetry: true
  # 免费渠道的 RPD 很低，对完整目录（含 direct/trusted 派生副本）的 deployment
  # 做 completion 式后台健康检查会本末倒置地耗尽免费额度。默认改用：
  # provider-monitor 的 /models 目录审计 + Router 被动熔断 + 手动 scripts/health_check.py。
  background_health_checks: false
  health_check_details: false
  store_prompts_in_spend_logs: false
