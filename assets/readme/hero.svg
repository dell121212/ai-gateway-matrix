<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AI Gateway Matrix</title>
  <desc id="desc">多个模型渠道经过健康、额度和任务强度判断，汇聚成一个 OpenAI 兼容 API。</desc>
  <rect width="1200" height="400" rx="28" fill="#070b14"/>
  <g stroke="#17243b" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400M640 0V400M720 0V400M800 0V400M880 0V400M960 0V400M1040 0V400M1120 0V400"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="78" fill="#4f8cff" font-size="18" font-weight="750" letter-spacing="3">OPENAI-COMPATIBLE · LOCAL-FIRST</text>
    <text x="64" y="154" fill="#ffffff" font-size="58" font-weight="760">AI Gateway</text>
    <text x="64" y="218" fill="#ffffff" font-size="58" font-weight="760">Matrix</text>
    <text x="64" y="270" fill="#aab7cb" font-size="24">一个端点，按任务强度、健康与额度选路</text>
    <g transform="translate(64 306)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
