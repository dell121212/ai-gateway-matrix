      <circle cx="24" cy="24" r="6" fill="#47d7a5"/>
      <text x="44" y="31" fill="#dbe7fa" font-size="19">127.0.0.1:4000/v1</text>
    </g>
  </g>
  <g transform="translate(675 58)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="0" y="112" width="162" height="64" rx="10" fill="#4f8cff"/>
    <text x="81" y="151" fill="#07101f" text-anchor="middle" font-size="20" font-weight="800">auto-route</text>
    <g fill="#111d31" stroke="#35527e" stroke-width="2">
      <rect x="260" y="0" width="196" height="58" rx="10"/>
      <rect x="260" y="76" width="196" height="58" rx="10"/>
      <rect x="260" y="152" width="196" height="58" rx="10"/>
      <rect x="260" y="228" width="196" height="58" rx="10"/>
