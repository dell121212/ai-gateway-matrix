version: 1
catalog_reviewed_at: "2026-07-18"

# 这份文件只存“调度与数据政策”，真实密钥仍只存在 .env。
# sensitive_allowed=true 是项目管理员的显式选择，不由 trust=official 自动推导。
defaults:
  sensitive_allowed: false
  data_policy: unverified
  capabilities:
    text: true
    vision: false
    tools: false
    json_object: false
    json_schema: false
    audio: false

providers:
  GLM_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  GROQ_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  CEREBRAS_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  SAMBANOVA_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  DEEPSEEK_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  DASHSCOPE_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  HUNYUAN_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  QIANFAN_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}
  MOONSHOT_API_KEY: {trust: official, sensitive_allowed: true, data_policy: provider_terms_apply}

  # 免费层数据使用条款需要用户单独确认，默认不承接敏感请求。
  GEMINI_API_KEY: {trust: official, sensitive_allowed: false, data_policy: review_required}
  MISTRAL_KEY_1: {trust: official, sensitive_allowed: false, data_policy: review_required}
  MISTRAL_KEY_2: {trust: official, sensitive_allowed: false, data_policy: review_required}

  SILICONFLOW_API_KEY: {trust: third_party}
  MODELSCOPE_API_KEY: {trust: third_party, sensitive_allowed: false, data_policy: review_required}
  CLOUDFLARE_API_TOKEN: {trust: third_party, sensitive_allowed: false, data_policy: review_required}
  KILO_API_KEY: {trust: observation, sensitive_allowed: false, data_policy: review_required}
  LLM7_API_KEY: {trust: observation, sensitive_allowed: false, data_policy: review_required}
  COHERE_API_KEY: {trust: official, sensitive_allowed: false, data_policy: review_required}
  AION_API_KEY: {trust: observation, sensitive_allowed: false, data_policy: review_required}
  OPENROUTER_API_KEY: {trust: third_party}
  GITHUB_TOKEN: {trust: third_party}
  HF_TOKEN: {trust: third_party}
  NVIDIA_API_KEY: {trust: third_party}
  DEEPINFRA_API_KEY: {trust: third_party}
  NOVITA_API_KEY: {trust: third_party}
  FIREWORKS_API_KEY: {trust: third_party}
  LEPTON_API_KEY: {trust: third_party}
  TOGETHER_API_KEY: {trust: third_party}
  GENERALCOMPUTE_API_KEY:
    trust: third_party
    billing: paid
    sensitive_allowed: false
    data_policy: review_required
    capabilities: {tools: true, json_object: true}
  AGNES_API_KEY: {trust: observation}
  AIHUBMIX_API_KEY: {trust: relay}
  VERCEL_AI_API_KEY: {trust: relay}
  GLAMA_API_KEY: {trust: relay}
  AIMLAPI_API_KEY: {trust: relay}

# 规则按顺序合并。未声明的能力默认为 false，避免静默丢弃工具/JSON 参数。
model_rules:
  - match: "gemini/*"
    capabilities: {vision: true, tools: true, json_object: true, json_schema: true}
  - match: "groq/qwen/qwen3.6-27b"
    capabilities: {vision: true, tools: true, json_object: true}
  - match: "groq/openai/gpt-oss-*"
    capabilities: {tools: true, json_object: true, json_schema: true}
  - match: "cerebras/gpt-oss-120b"
    capabilities: {tools: true, json_object: true, json_schema: true}
  - match: "openai/gpt-4o-mini"
    capabilities: {vision: true, tools: true, json_object: true, json_schema: true}
  - match: "deepseek/deepseek-reasoner"
    capabilities: {json_object: true}
  - match: "openai/llama-4-maverick-17b"
    capabilities: {vision: true, tools: true, json_object: true}

# 额度未经真实账号验证时不在这里伪造 RPD/TPD。运行时会把
# config.yaml 里同一凭据的 rpm 取最大值作为保守的 credential 级共享上限。
limits: {}
